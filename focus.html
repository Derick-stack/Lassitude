<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lassitude: a private daily routine for faith, fitness and focus.">
<title>Focus · Lassitude</title>
<link rel="stylesheet" href="style-luxury.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-page="focusPage">
<header id="site-header"></header>
<main class="wrap">
<section class="hero"><h1>Focus</h1><p>Work in focused intervals, attach a task, and keep a quiet record of your sessions.</p></section>
<div class="focus-layout">
<section class="card focus-timer-card" data-tour="pomodoro"><p class="eyebrow">Pomodoro</p><h2 id="phase-title">Focus session</h2><div class="time" id="time" role="timer" aria-live="polite">25:00</div><div class="meter" id="barWrap" role="progressbar" aria-label="Current interval progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar"></div></div><p id="cycle-count" aria-live="polite">Cycle 1 of 4</p><label for="focus-task-select">Attach to task</label><select id="focus-task-select"><option value="">No task</option></select><div class="focus-controls"><button id="start" type="button">Start</button><button id="pause" type="button" class="ghost">Pause</button><button id="reset" type="button" class="ghost">Reset interval</button></div><p id="note" aria-live="polite"></p></section>
<section class="card"><h2>Cycle settings</h2><form id="pomodoro-settings" class="focus-settings"><label for="focus-minutes">Focus minutes</label><input id="focus-minutes" type="number" min="1" max="120" required><label for="short-minutes">Short break minutes</label><input id="short-minutes" type="number" min="1" max="60" required><label for="long-minutes">Long break minutes</label><input id="long-minutes" type="number" min="1" max="90" required><label for="long-every">Long break every cycles</label><input id="long-every" type="number" min="2" max="8" required><button>Save cycle settings</button></form><small id="focus-settings-status" aria-live="polite"></small></section>
<section class="card" data-tour="focus-tasks"><h2>Tasks</h2><form id="focus-task-form" class="row"><label for="focus-task-title">New task</label><input id="focus-task-title" type="text" maxlength="100" required><button>Add</button></form><ul id="focus-task-list" class="list"></ul></section>
<section class="card" data-tour="ambient-audio"><h2>Ambient sound</h2><label for="ambient-type">Sound</label><select id="ambient-type"><option value="rain">Rain</option><option value="ocean">Ocean</option><option value="forest">Forest</option><option value="brown">Brown noise</option></select><label for="ambient-volume">Volume</label><input id="ambient-volume" type="range" min="0" max="1" step="0.01"><output id="ambient-volume-value" for="ambient-volume"></output><div class="focus-controls"><button id="ambient-start" type="button">Play sound</button><button id="ambient-stop" type="button" class="ghost">Stop sound</button></div><small id="ambient-status" aria-live="polite">Sound is generated in your browser. No audio files are loaded.</small></section>
<section class="card" data-tour="focus-garden"><h2>Focus garden</h2><div class="plant" id="plant" aria-hidden="true">🌱</div><p id="plantNote"></p><p id="garden-status" aria-live="polite"></p><ul id="garden-history" class="list"></ul></section>
<section class="card"><h2>Focus statistics</h2><div id="focus-stats" class="history-summary"></div><ul id="focus-chart" class="list"></ul></section>
</div>
</main>
</body>
</html>
