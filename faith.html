<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; frame-src https://open.spotify.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Read a short public-domain devotional, keep a private prayer journal, and review scripture cards.">
<title>Faith · Lassitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style-luxury.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-page="faithPage">
<header id="site-header"></header>
<main class="wrap">
<section class="hero"><h1>Faith</h1><p>A short daily reading, a place to reflect, and private practices you can return to.</p></section>
<div class="faith-grid">
<section class="card" data-tour="reading-plan"><p class="eyebrow">Public-domain King James Version</p><h2>Reading plan</h2><form id="reading-plan-form" class="row"><label for="reading-plan-length">Plan length</label><select id="reading-plan-length"><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select><button>Start plan</button></form><p id="reading-plan-status" aria-live="polite"></p><p id="reading-plan-progress" aria-live="polite"></p><h3 id="reading-title"></h3><p class="big" id="reading-verse"></p><small id="reading-reference"></small><h3>Reflect</h3><p id="reading-reflection"></p><h3>Prayer prompt</h3><p id="reading-prayer"></p><form id="devotional-form"><label for="devotional-note">Private reflection</label><textarea id="devotional-note" rows="3" maxlength="2000"></textarea><button>Save reflection</button><button type="button" id="mark-reading">Mark today read</button><small id="devotional-status" aria-live="polite"></small></form></section>
<section class="card" data-tour="prayer-journal"><h2>Prayer journal</h2><form id="prayer-entry-form"><label for="prayer-entry">Private prayer or reflection</label><textarea id="prayer-entry" rows="3" maxlength="1500" required></textarea><button>Save prayer entry</button></form><ul id="prayer-entry-list" class="list"></ul></section>
<section class="card" data-tour="prayer-requests"><h2>Prayer requests</h2><form id="prayer-request-form"><label for="request-title">Request</label><input id="request-title" type="text" maxlength="100" required><label for="request-details">Details (optional)</label><textarea id="request-details" rows="2" maxlength="800"></textarea><button>Add request</button></form><ul id="prayer-request-list" class="list"></ul></section>
<section class="card" data-tour="scripture-cards"><h2>Scripture memory cards</h2><form id="scripture-card-form"><label for="card-reference">Reference</label><input id="card-reference" type="text" maxlength="100" required><label for="card-text">KJV verse</label><textarea id="card-text" rows="3" maxlength="1200" required></textarea><button>Add card</button></form><div id="flashcard-review" class="flashcard-review"></div></section>
<section class="card" data-tour="gratitude"><h2>Gratitude log</h2><form id="gratitude-form" class="row"><label for="gratitude-entry">One thing you’re grateful for</label><input id="gratitude-entry" type="text" maxlength="300" required><button>Save</button></form><ul id="gratitude-list" class="list"></ul></section>
</div>
</main>
</body>
</html>
