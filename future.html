<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; frame-src https://open.spotify.com; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Lassitude: a private daily routine for faith, fitness and focus.">
<title>Future · Lassitude</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style-luxury.css">
<script type="module" src="js/app.js"></script>
</head>
<body data-page="futurePage">
<header id="site-header"></header>
<main class="wrap">
<section class="hero"><h1>Future</h1><p>Name what you’re working toward and mark your milestones.</p></section>
<div class="grid">
<section class="card"><h2>Goals</h2><form id="goalForm" class="row"><label for="g">New goal, e.g. Run a 5k</label><input type="text" id="g"><label for="goalDue">Due date (optional)</label><input type="date" id="goalDue"><button>Add</button></form><ul class="list" id="goalList"></ul></section>
<section class="card"><h2>Milestones</h2><form id="mileForm" class="row"><label for="m">Milestone reached</label><input type="text" id="m"><button>Log</button></form><ul class="list" id="mileList"></ul></section>
<section class="card"><h2>Vision board</h2><form id="visionForm" class="row"><label for="v">Something you’re aiming for</label><input type="text" id="v"><button>Add</button></form><ul class="list" id="visionList"></ul></section>
</div>
</main>
</body>
</html>
